# System runtime configuration.
system:
  model_dir: "models"
  feature_schema_version: "v1"
  api_host: "0.0.0.0"
  api_port: 8000
  demo_mode: false
  ingestion:
    mode: "dataset"   # dataset | live | demo
    batch_size: 100
  threat_intel:
    provider: "mock"  # mock | abuseipdb | custom
    timeout_seconds: 5
  websocket:
    heartbeat_seconds: 30
