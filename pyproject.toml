[project]
name = "hybrid-nids"
version = "1.0.0"
description = "Hybrid AI Network Intrusion Detection & Adaptive SOC (research-grade)"
requires-python = ">=3.10"
dependencies = [
  "fastapi", "uvicorn", "pydantic", "pydantic-settings", "SQLAlchemy",
  "pandas", "numpy", "scikit-learn", "scipy", "joblib", "torch",
  "PyYAML", "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
